<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Generative AI Developer · Animated Hero</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #02030c;
      --ink: #eaf1ff;
      --muted: #dee5f2;
      --cyan: #22d3ee;
      --blue: #3b82f6;
      --violet: #8b5cf6;
      --glass: rgba(18, 38, 110, .38);
      --line: rgba(130, 170, 255, .4);
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    :root[data-theme="dark"] {
      color-scheme: dark
    }

    html {
      height: 100%;
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    *,
    *::before,
    *::after {
      box-sizing: inherit
    }

    body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden
    }

    /* image stage: overlays share the image coordinate space */
    #stage {
      position: absolute;
      will-change: transform
    }

    .zoom {
      position: absolute;
      inset: 0;
      transform-origin: 69% 50%;
      animation: kb 30s ease-in-out infinite alternate
    }

    @keyframes kb {
      to {
        transform: scale(1.07)
      }
    }

    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block
    }

    .glow {
      position: absolute;
      left: 68.8%;
      top: 50%;
      width: 46%;
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(56, 130, 255, .5), rgba(139, 92, 246, .2) 40%, transparent 68%);
      mix-blend-mode: screen;
      animation: pulse 4.6s ease-in-out infinite
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: .5;
        transform: translate(-50%, -50%) scale(.9)
      }

      50% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.1)
      }
    }

    .orb {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible
    }

    .orb ellipse {
      fill: none;
      stroke-width: 1.6;
      animation: dash 7s linear infinite
    }

    .orb ellipse+ellipse {
      animation-duration: 11s;
      animation-direction: reverse;
      opacity: .55
    }

    @keyframes dash {
      to {
        stroke-dashoffset: -200
      }
    }

    .chip {
      position: absolute;
      left: 0;
      top: 0;
      padding: .38em .9em;
      border-radius: 99px;
      font-size: clamp(10px, 1.05vw, 15px);
      font-weight: 600;
      letter-spacing: .02em;
      color: #d6e4ff;
      white-space: nowrap;
      background: var(--glass);
      border: 1px solid var(--line);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 0 18px rgba(59, 130, 246, .55);
      will-change: transform
    }

    /* screen-wide light */
    .aurora {
      position: fixed;
      inset: 0;
      overflow: hidden;
      mix-blend-mode: screen;
      pointer-events: none
    }

    .aurora i {
      position: absolute;
      width: 42vmax;
      height: 42vmax;
      border-radius: 50%;
      filter: blur(80px);
      opacity: .26
    }

    .aurora i:nth-child(1) {
      background: #1d4ed8;
      left: -12%;
      top: -18%;
      animation: d1 19s ease-in-out infinite alternate
    }

    .aurora i:nth-child(2) {
      background: #7c3aed;
      right: -10%;
      bottom: -22%;
      animation: d2 23s ease-in-out infinite alternate
    }

    .aurora i:nth-child(3) {
      background: #06b6d4;
      left: 38%;
      top: 28%;
      opacity: .12;
      animation: d1 27s ease-in-out infinite alternate-reverse
    }

    @keyframes d1 {
      to {
        transform: translate(18vw, 12vh) scale(1.2)
      }
    }

    @keyframes d2 {
      to {
        transform: translate(-16vw, -10vh) scale(1.15)
      }
    }

    .shade {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(90deg, rgba(2, 3, 12, .85) 0%, rgba(2, 3, 12, .5) 36%, transparent 62%)
    }

    .beam {
      position: fixed;
      inset: -20%;
      pointer-events: none;
      mix-blend-mode: screen;
      background: linear-gradient(115deg, transparent 42%, rgba(130, 175, 255, .1) 50%, transparent 58%);
      animation: sweep 10s linear infinite
    }

    @keyframes sweep {
      from {
        transform: translateX(-55%)
      }

      to {
        transform: translateX(55%)
      }
    }

    #fx {
      position: fixed;
      inset: 0;
      pointer-events: none
    }

    .cursor {
      position: fixed;
      left: 0;
      top: 0;
      width: 360px;
      height: 360px;
      margin: -180px 0 0 -180px;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
      transition: opacity .5s;
      mix-blend-mode: screen;
      background: radial-gradient(circle, rgba(80, 140, 255, .24), transparent 65%)
    }

    /* content */
    .hero {
      position: relative;
      z-index: 5;
      height: 100%;
      max-width: min(700px, 92vw);
      padding: 0 clamp(20px, 6vw, 96px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1.1rem
    }

    .hero>* {
      margin: 0;
      opacity: 0;
      animation: rise 1s cubic-bezier(.2, .7, .2, 1) .15s forwards
    }
    .hero .availablebtn{
      background-color:#040d20; border: 1px solid #212c46; border-radius: 100px;
      padding: 12px 20px;
      width: fit-content;
      font-weight: 700;
      color: #7683a3;
      position: relative;
      display:flex;
      align-items: center;
      gap: 10px;
    }
     .hero .availablebtn span{
    background-color: #0af090;
    width: 10px;
    height: 10px;
    border-radius: 100px;
    box-shadow: 0px 0px 10px 3px #0af090;
    display: block;
     }
    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(22px);
        filter: blur(6px)
      }

      to {
        opacity: 1;
        transform: none;
        filter: none
      }
    }

    h1 {
      height: 80px;
  font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: clamp(2.1rem, 5.2vw, 4.3rem);
      line-height: 1.06;
      letter-spacing: -.025em;
      background: linear-gradient(100deg, #eaf1ff 0%, #eaf1ff 35%, #7dd3fc 48%, #c4b5fd 56%, #eaf1ff 70%, #eaf1ff 100%);
      background-size: 250% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: #fff;
      animation: rise 1s cubic-bezier(.2, .7, .2, 1) .15s forwards, shine 7s ease-in-out 1.4s infinite
    }

    @keyframes shine {
      0% {
        background-position: 100% 0
      }

      60%,
      100% {
        background-position: -60% 0
      }
    }

    .type {
      font-size: clamp(1.05rem, 2vw, 1.5rem);
      color: var(--muted);
      min-height: 1.6em
    }

    .type b {
      color: var(--cyan);
      font-weight: 600
    }

    .caret {
      display: inline-block;
      width: 2px;
      height: 1.1em;
      margin-left: 3px;
      vertical-align: -.15em;
      background: var(--cyan);
      animation: blink 1s steps(1) infinite
    }

    @keyframes blink {
      50% {
        opacity: 0
      }
    }

    .sub {
      max-width: 46ch;
      line-height: 1.6;
      color: var(--muted)
    }

    .cta {
      display: flex;
      gap: .8rem;
      flex-wrap: wrap;
      margin-top: .4rem !important
    }

    .btn {
      position: relative;
      overflow: hidden;
      border: 1px solid transparent;
      border-radius: 12px;
      padding: .85em 1.6em;
    font-family: 'Plus Jakarta Sans', sans-serif;
      color: #fff;
      cursor: pointer;
      transition: transform .2s, box-shadow .3s, background .3s
    }

    .btn:hover {
      transform: translateY(-2px)
    }

    .btn:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 3px
    }

    .primary {
      background: linear-gradient(120deg, var(--blue), var(--violet));
      box-shadow: 0 0 24px rgba(79, 120, 255, .55)
    }

    .primary:hover {
      box-shadow: 0 0 40px rgba(110, 120, 255, .85)
    }

    .ghost {
      background: rgba(20, 40, 110, .3);
      border-color: var(--line)
    }

    .ghost:hover {
      background: rgba(40, 70, 160, .45)
    }

    .rip {
      position: absolute;
      width: 12px;
      height: 12px;
      margin: -6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .5);
      animation: rip .7s ease-out forwards;
      pointer-events: none
    }

    @keyframes rip {
      to {
        transform: scale(24);
        opacity: 0
      }
    }

    @media (max-aspect-ratio:23/20) {
      .shade {
        background: linear-gradient(180deg, rgba(2, 3, 12, .88) 0%, rgba(2, 3, 12, .55) 45%, transparent 75%)
      }

      .hero {
        justify-content: flex-start;
        padding-top: 11vh;
        max-width: 100%
      }
    }

    @media (prefers-reduced-motion:reduce) {

      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important
      }

      .hero>* {
        opacity: 1
      }
    }
  </style>
</head>

        st.style.transform = 'translate3d(' + (-mx * 26) + 'px,' + (-my * 16) + 'px,0)';
        place(t);
        cx.clearRect(0, 0, w, h); cx.globalCompositeOperation = 'lighter';
        var i, j, p, a, b, dx, dy, d;
        for (i = 0; i < P.length; i++) {
          p = P[i]; p.x += p.vx; p.y += p.vy;
          if (p.x < 0 || p.x > w) p.vx *= -1; if (p.y < 0 || p.y > h) p.vy *= -1;
          dx = p.x - mouse.x; dy = p.y - mouse.y; d = dx * dx + dy * dy;
          if (d < 14000) { var f = (1 - d / 14000) * .05; p.x += dx * f; p.y += dy * f }
          cx.fillStyle = 'rgba(140,190,255,.8)'; cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 6.283); cx.fill();
        }
        cx.lineWidth = .6;
        for (i = 0; i < P.length; i++) {
          a = P[i];
          dx = a.x - mouse.x; dy = a.y - mouse.y; d = dx * dx + dy * dy;
          if (d < 22000) { cx.strokeStyle = 'rgba(120,220,255,' + (1 - d / 22000) * .6 + ')'; cx.beginPath(); cx.moveTo(a.x, a.y); cx.lineTo(mouse.x, mouse.y); cx.stroke() }
          for (j = i + 1; j < P.length; j++) {
            b = P[j]; dx = a.x - b.x; dy = a.y - b.y; d = dx * dx + dy * dy;
            if (d < 9000) { cx.strokeStyle = 'rgba(90,150,255,' + (1 - d / 9000) * .35 + ')'; cx.beginPath(); cx.moveTo(a.x, a.y); cx.lineTo(b.x, b.y); cx.stroke() }
          }
        }
        var rows = 6, cols = Math.ceil(w / 14), r, c, base, amp, y;
        for (r = 0; r < rows; r++) {
          base = h * (.88 + r * .018); amp = 16 + r * 5;
          for (c = 0; c <= cols; c++) {
            y = base + Math.sin(c * .11 + t * .0012 + r * .7) * amp * .6 + Math.sin(c * .05 - t * .0008 + r) * amp * .5;
            cx.fillStyle = 'hsla(' + (205 + c / cols * 80) + ',100%,65%,' + (.14 + .5 * r / rows) + ')'; cx.fillRect(c * 14, y, 1.8, 1.8);
          }
        }
        if (Math.random() < .006) stars.push({ x: Math.random() * w * .8, y: Math.random() * h * .35, vx: 9 + Math.random() * 5, vy: 3 + Math.random() * 3, l: 1 });
        stars = stars.filter(function (s) {
          s.x += s.vx; s.y += s.vy; s.l -= .018;
          var g = cx.createLinearGradient(s.x, s.y, s.x - s.vx * 9, s.y - s.vy * 9);
          g.addColorStop(0, 'rgba(200,230,255,' + s.l + ')'); g.addColorStop(1, 'rgba(200,230,255,0)');
          cx.strokeStyle = g; cx.lineWidth = 1.6; cx.beginPath(); cx.moveTo(s.x, s.y); cx.lineTo(s.x - s.vx * 9, s.y - s.vy * 9); cx.stroke();
          return s.l > 0;
        });
        if (!reduce) requestAnimationFrame(frame);
      }
      addEventListener('pointermove', function (e) {
        mouse.x = e.clientX; mouse.y = e.clientY; tx = e.clientX / w - .5; ty = e.clientY / h - .5;
        cur.style.opacity = 1; cur.style.transform = 'translate(' + e.clientX + 'px,' + e.clientY + 'px)';
      });
      addEventListener('pointerleave', function () { mouse.x = mouse.y = -9999; cur.style.opacity = 0 });
      addEventListener('resize', layout);

      /* typewriter */
      var words = ["Hi, I'm Farhan."],
        tw = document.getElementById('tw'),
        wi = 0,
        ci = 0,
        del = false;
      function type() {
        var word = words[wi], d = del ? 35 : 70; ci += del ? -1 : 1; tw.textContent = word.slice(0, ci);
        if (!del && ci === word.length) { del = true; d = 1500 } else if (del && ci === 0) { del = false; wi = (wi + 1) % words.length; d = 350 }
        setTimeout(type, d);
      }
      if (reduce) tw.textContent = words[1]; else type();

      /* button ripple */
      [].forEach.call(document.querySelectorAll('.btn'), function (b) {
        b.addEventListener('click', function (e) {
          var r = b.getBoundingClientRect(), s = document.createElement('span');
          s.className = 'rip'; s.style.left = e.clientX - r.left + 'px'; s.style.top = e.clientY - r.top + 'px';
          b.appendChild(s); setTimeout(function () { s.remove() }, 700);
        });
      });

      layout(); requestAnimationFrame(frame);
    })();
  </script>
